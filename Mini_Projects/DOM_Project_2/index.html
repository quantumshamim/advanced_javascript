<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toogle Password Visibility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h1 class="text-center">Login</h1>

                <form action="">
                    <div class="mt-3 mb-2">
                        <label for="email" class="form-control">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="enter your e-mail">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-control">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="enter your password">
                            <button class="btn btn-outline-info" id="togglePassword">Show</button>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>



    <script src="./script.js"></script>
</body>
</html>
