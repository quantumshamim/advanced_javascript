<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Word Counter</h2>
        <div class="m-3">
            <label for="textInput" class="form-label">Enter your text</label>
            <textarea name="" id="textInput" rows="6" class="form-control"></textarea>
        </div>
        <p class="text-center">Word Count : <span id="wordCount">0</span></p>
    </div>



    <script src="./script.js"></script>
</body>
</html>
