<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
</head>
<body>
    
    <button onclick="history.back()">back button</button>
    <button onclick="history.forward()">forward button</button>
    <button onclick="history.go(-1)">go back 1 page</button>
    <button onclick="history.go(0)">refresh</button>

    
</body>
</html>
