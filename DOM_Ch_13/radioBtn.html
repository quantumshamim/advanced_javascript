<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button</title>
</head>
<body>
    <h1>Select you fav prog Lang</h1>

    <div>
        <input type="radio" name="language" value="TypeScript" id="ts">
        <label for="ts">TypeScript</label>
    </div>

    <div>
        <input type="radio" name="language" value="JavaScript" id="js">
        <label for="js">JavaScript</label>
    </div>

    <div>
        <input type="radio" name="language" value="Python" id="py">
        <label for="py">Python</label>
    </div>

    <div>
        <input type="radio" name="language" value="Dart" id="d">
        <label for="d">Dart</label>
    </div>

    </div>
        <button id="btn">Show Data</button>
        <p id="output"></p>
    <div>



    <script src="./radioBtn.js"></script>
</body>
</html>
